<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- 基本信息 -->
    <title>Future Helios - 程序员工具箱 | 文档提取、图片转换、代码格式化</title>
    <meta name="description" content="Future Helios是面向开发者的免费在线工具集合平台，提供文档提取、图片格式转换、JSON工具箱、代码格式化、编码转换、文本对比、时间戳转换、二维码工具等8个核心工具，所有数据本地处理安全可靠。" />
    <meta name="keywords" content="程序员工具箱,开发者工具,文档提取,图片转换,代码格式化,JSON工具,Base64编码,时间戳转换,二维码生成,在线工具,免费工具" />
    <meta name="author" content="Future Helios" />
    
    <!-- SEO优化 -->
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />
    <meta name="baiduspider" content="index, follow" />
    
    <!-- Open Graph / 社交媒体 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Future Helios - 程序员工具箱" />
    <meta property="og:description" content="面向开发者的免费在线工具集合平台，8个核心工具提升开发效率" />
    <meta property="og:image" content="/favicon.svg" />
    
    <!-- 移动端优化 -->
    <meta name="mobile-agent" content="format=html5; url=https://future-helios.vercel.app" />
    <meta name="applicable-device" content="pc,mobile" />
    
    <!-- 网站验证（部署后需要添加搜索引擎提供的验证码） -->
    <!-- 百度验证：<meta name="baidu-site-verification" content="你的验证码" /> -->
    <!-- Google验证：<meta name="google-site-verification" content="你的验证码" /> -->
  </head>
  <body>
    <!-- 预加载动画 -->
    <div id="app-loading">
      <style>
        #app-loading {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 9999;
          transition: opacity 0.4s ease;
        }
        #app-loading.fade-out {
          opacity: 0;
        }
        .loading-logo {
          font-size: 28px;
          font-weight: 700;
          color: #fff;
          margin-bottom: 24px;
          letter-spacing: 2px;
        }
        .loading-spinner {
          width: 44px;
          height: 44px;
          border: 3px solid rgba(255, 255, 255, 0.2);
          border-top-color: #fff;
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
        .loading-text {
          margin-top: 18px;
          color: rgba(255, 255, 255, 0.9);
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          font-size: 14px;
        }
        .loading-dots::after {
          content: '';
          animation: dots 1.2s steps(4, end) infinite;
        }
        @keyframes dots {
          0%, 20% { content: ''; }
          40% { content: '.'; }
          60% { content: '..'; }
          80%, 100% { content: '...'; }
        }
        .loading-tip {
          margin-top: 12px;
          color: rgba(255, 255, 255, 0.6);
          font-size: 12px;
        }
      </style>
      <div class="loading-logo">Future Helios</div>
      <div class="loading-spinner"></div>
      <div class="loading-text">正在加载应用<span class="loading-dots"></span></div>
      <div class="loading-tip">首次加载可能需要几秒钟</div>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
